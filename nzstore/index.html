<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>NZ Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="nz">NZ</span> <span class="store">Store</span></div>
  <div class="tagline">by NatxoBSD</div>
  <div class="lang-chips" id="lang-chips">
    <button class="lang-chip" data-lang="es" tabindex="0"><img src="fl-es.png" alt="ES">ES</button>
    <button class="lang-chip" data-lang="en" tabindex="0"><img src="fl-en.png" alt="EN">EN</button>
    <button class="lang-chip" data-lang="it" tabindex="0"><img src="fl-it.png" alt="IT">IT</button>
    <button class="lang-chip" data-lang="fr" tabindex="0"><img src="fl-fr.png" alt="FR">FR</button>
    <button class="lang-chip" data-lang="de" tabindex="0"><img src="fl-de.png" alt="DE">DE</button>
    <button class="lang-chip" data-lang="pt" tabindex="0"><img src="fl-pt.png" alt="PT">PT</button>
  </div>
  <div class="conn" id="conn">● conectando…</div>
</header>

<nav>
  <button class="tab active" id="tab-apps" data-tab="apps">📦 Apps</button>
  <button class="tab" id="tab-control" data-tab="control">🎛️ <span id="tab-control-txt">Control</span></button>
</nav>

<main>
  <section id="sec-apps">
    <div class="toolbar">
      <select id="repo-sel" tabindex="0"></select>
      <button id="add-repo-btn" class="add-btn" tabindex="0">➕ Añadir repo</button>
    </div>
    <div class="featured-label" id="featured-label">⭐ Destacados (curados por NatxoBSD)</div>
    <div class="grid" id="featured"></div>
    <div class="featured-label" id="cat-label">📦 Catálogo</div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>Sin resultados</div>
  </section>

  <section id="sec-control" hidden>
    <div class="featured-label" id="ctrl-label">🎛️ Ajustes rápidos (root)</div>
    <div class="toggles" id="toggles"></div>
    <div class="hint" id="ctrl-hint"></div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <img id="m-icon" src="" alt="">
    <div class="modal-body">
      <h2 id="m-title"></h2>
      <div class="m-meta" id="m-meta"></div>
      <p id="m-desc"></p>
      <div class="m-actions">
        <button id="m-install" tabindex="0">⬇️ Instalar</button>
        <button id="m-close" tabindex="0">Cerrar</button>
      </div>
      <pre class="m-log" id="m-log"></pre>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<div class="modal" id="modal-repo" hidden>
  <div class="modal-box">
    <div class="modal-body">
      <h2 id="r-title">Añadir repositorio</h2>
      <div class="m-actions">
        <input id="r-url" type="text" placeholder="https://…/apps.json" tabindex="0">
      </div>
      <div class="r-list" id="r-list"></div>
      <div class="m-actions">
        <button id="r-save" tabindex="0">Guardar</button>
        <button id="r-close" tabindex="0">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
